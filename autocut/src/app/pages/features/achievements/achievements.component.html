<div class="min-h-screen w-full pb-20 relative overflow-visible">

    <div class="absolute inset-0 -z-10 bg-gradient-to-br from-[#880e0e]/20 via-white to-gray-100"></div>

    <div class="absolute -top-40 left-20 w-96 h-96 bg-[#880e0e]/25 rounded-full blur-3xl opacity-50"></div>
    <div class="absolute bottom-0 right-10 w-[28rem] h-[28rem] bg-[#880e0e]/20 rounded-full blur-3xl opacity-40"></div>
    <div class="absolute top-40 right-0 w-72 h-72 bg-[#880e0e]/15 rounded-full blur-2xl opacity-70"></div>

    <div class="relative isolate overflow-visible py-12 pb-2">

        <div class="max-w-7xl mx-auto px-10 flex items-center gap-16">

            <div class="flex-shrink-0">
                <div class="w-32 h-32 rounded-full bg-[#880e0e]/10 backdrop-blur-md border border-[#880e0e]/20
                flex items-center justify-center shadow-xl animate-bounce-slow">
                    <span class="text-[#880e0e] text-5xl font-extrabold">🏆</span>
                </div>
            </div>

            <div class="flex flex-col max-w-xl">
                <h1 class="text-4xl font-black tracking-tight text-gray-900 drop-shadow-sm ">
                    Logros de AutoCut
                </h1>

                <p class="mt-3 text-lg text-gray-700 leading-relaxed">
                    Explora los logros disponibles y desbloquea insignias completando actividades
                    dentro del ecosistema AutoCut.
                </p>

                <div class="w-120 h-1 bg-[#880e0e] rounded-full mt-5"></div>
            </div>

            <div class="flex flex-col gap-4">

                <div class="px-8 py-5 rounded-2xl border border-gray-200 bg-white 
                    shadow-[0_4px_16px_rgba(136,14,14,0.18)]
                    hover:shadow-[0_6px_22px_rgba(136,14,14,0.32)]
                    transition-all w-64">

                    <p class="text-3xl font-extrabold text-[#880e0e] leading-none">
                        {{ unlockedCount() }}/{{ totalCount() }}
                    </p>
                    <p class="mt-1 text-gray-600 font-medium">Logros desbloqueados</p>
                </div>


                <div class="px-8 py-5 rounded-2xl border border-gray-200 bg-white 
                    shadow-[0_4px_16px_rgba(136,14,14,0.18)]
                    hover:shadow-[0_6px_22px_rgba(136,14,14,0.32)]
                    transition-all w-64">

                    <p class="text-xl font-semibold text-gray-900 flex items-center gap-1">
                        Sigue avanzando
                    </p>
                    <p class="text-gray-600 text-sm mt-1">
                        Cada insignia representa tu progreso en AutoCut.
                    </p>
                </div>


            </div>

        </div>
    </div>

    <div class="max-w-7xl mx-auto px-6 mt-10">
        <app-all-achievements-list></app-all-achievements-list>
    </div>

</div>
