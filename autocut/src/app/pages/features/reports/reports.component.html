<div class="min-h-screen w-full pb-20">

  <div class="w-full mx-auto px-10 py-10">

    <!-- TÍTULO -->
    <h1 class="text-4xl font-black tracking-tight text-gray-900 mb-4">
      Historial de Reportes
    </h1>

    <p class="text-gray-600 text-lg mb-8">
      Consulta todos los reportes generados por los administradores del sistema.
    </p>

    <div class="w-40 h-1 bg-[#880e0e] rounded-full mb-10"></div>

    <div *ngIf="loading" class="text-center text-gray-500 py-6">
      Cargando historial...
    </div>

    <app-report-history
      *ngIf="!loading"
      [historial]="historial">
    </app-report-history>

  </div>

</div>
