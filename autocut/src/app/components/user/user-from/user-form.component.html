<form [formGroup]="userForm" class="space-y-6 bg-white p-6 rounded-xl shadow-md border border-gray-200">
  
  <h2 class="text-2xl font-semibold text-gray-900 border-b pb-2">
    Editar Usuario
  </h2>

  <!-- Email -->
  <div class="space-y-1">
    <label for="email" class="text-sm font-medium text-gray-700">Correo electrónico*</label>
    
    <input 
      id="email" 
      formControlName="email" 
      type="email"
      readonly
      class="w-full border border-gray-300 rounded-lg px-4 py-2.5 bg-gray-100 cursor-not-allowed
             focus:outline-none focus:ring-2 focus:ring-red-300"
    />

    @if (userForm.controls['email'].invalid && (userForm.controls['email'].dirty || userForm.controls['email'].touched)) {
      <p class="text-red-600 text-xs mt-1">El correo electrónico es obligatorio</p>
    }
    @if (userForm.controls['email'].errors?.['email']) {
      <p class="text-red-600 text-xs mt-1">Formato de correo inválido</p>
    }
  </div>

  <!-- Name -->
  <div class="space-y-1">
    <label for="name" class="text-sm font-medium text-gray-700">Nombre*</label>
    
    <input 
      id="name" 
      formControlName="name" 
      type="text"
      class="w-full border border-gray-300 rounded-lg px-4 py-2.5
             focus:outline-none focus:ring-2 focus:ring-red-300"
    />
  </div>

  <!-- Lastname -->
  <div class="space-y-1">
    <label for="lastname" class="text-sm font-medium text-gray-700">Apellido*</label>
    
    <input 
      id="lastname" 
      formControlName="lastname" 
      type="text"
      class="w-full border border-gray-300 rounded-lg px-4 py-2.5
             focus:outline-none focus:ring-2 focus:ring-red-300"
    />
  </div>

  <!-- Botón -->
  <div class="flex justify-end pt-4">
    <button 
      (click)="callSave()" 
      [disabled]="userForm.invalid"
      class="bg-[#B71C1C] text-white px-6 py-2.5 rounded shadow
             disabled:bg-gray-300 disabled:cursor-not-allowed
             transition-all hover:bg-red-900"
    >
      Guardar
    </button>
  </div>

</form>
