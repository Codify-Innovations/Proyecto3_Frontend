<div class="relative group flex flex-col items-center">

  <div
    class="w-40 h-40 p-2 rounded-full bg-white
           shadow-[0_0_18px_rgba(136,14,14,0.25)]
           flex items-center justify-center
           transition-all duration-300
           group-hover:scale-110 group-hover:shadow-[0_0_32px_rgba(136,14,14,0.45)]
           overflow-hidden"
  >
    <img
      [src]="logro.iconoUrl"
      alt="badge"
      class="w-full h-full object-contain transition"
      [class.opacity-30]="!unlocked"
      [class.grayscale]="!unlocked"
    />
  </div>

  <div
    class="absolute top-[120%] left-1/2 -translate-x-1/2
           opacity-0 group-hover:opacity-100 pointer-events-none group-hover:pointer-events-auto
           transition-all duration-300
           bg-white border border-gray-200 shadow-xl rounded-xl
           p-4 w-60 z-50"
  >
    <h4 class="font-bold text-gray-900 text-md">{{ logro.nombre }}</h4>
    <p class="text-sm text-gray-600 mt-1">{{ logro.descripcion }}</p>
  </div>

</div>
