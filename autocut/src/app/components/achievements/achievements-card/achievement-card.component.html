<div class="relative flex flex-col items-center
         bg-gradient-to-b from-[#f8f8f8] to-[#ffffff]
         rounded-2xl border border-gray-300
         shadow-[0_0_18px_rgba(136,14,14,0.30)]
         hover:shadow-[0_0_32px_rgba(136,14,14,0.55)]
         hover:-translate-y-1
         transition-all duration-300
         p-8 w-72 overflow-hidden">
  <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-[#880e0e] to-[#c71f1f]"></div>

  <div class="p-4 rounded-full bg-white shadow-[0_4px_15px_rgba(0,0,0,0.18)] mb-4">
    <img *ngIf="logro.iconoUrl" [src]="logro.iconoUrl" alt="Icono logro"
      class="w-24 h-24 object-contain drop-shadow-md" />
  </div>

  <h3 class="text-lg font-bold text-[#1c1c1c] text-center leading-tight tracking-tight">
    {{ logro.nombre }}
  </h3>

  <p class="text-sm text-gray-600 text-center mt-2 px-1">
    {{ logro.descripcion }}
  </p>

  <div class="w-20 h-px bg-gray-300 my-4"></div>

  <p class="text-xs font-medium text-gray-500 text-center">
    Obtenido el:
    <span *ngIf="fechaDesbloqueo" class="text-[#880e0e] font-semibold">
      {{ fechaDesbloqueo | date : "dd/MM/yyyy" }}
    </span>
    <span *ngIf="!fechaDesbloqueo">—</span>
  </p>
</div>
