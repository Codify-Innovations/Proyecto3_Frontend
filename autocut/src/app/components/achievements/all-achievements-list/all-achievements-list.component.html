<div class="w-full max-w-6xl mx-auto px-1 mt-12 mb-20">
    <div class="flex flex-col items-center text-center mb-12">

        <!-- Icono -->
        <div class="w-16 h-16 rounded-full bg-white shadow-[0_4px_14px_rgba(136,14,14,0.30)]
           flex items-center justify-center border border-[#880e0e]/20 mb-4">
            <span class="text-3xl">🎖️</span>
        </div>

        <!-- Título + descripción -->
        <h3 class="text-4xl font-extrabold text-[#1C1C1C] tracking-tight">
            Insignias disponibles
        </h3>

        <p class="text-gray-600 text-sm mt-2 max-w-xl">
            Explora las Insignias que puedes desbloquear dentro de AutoCut.
        </p>

    </div>

    <div *ngIf="achievementsWithState().length > 0"
        class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-8 place-items-center">
        <app-all-achievements-card *ngFor="let item of achievementsWithState()" [logro]="item.logro"
            [unlocked]="item.unlocked"></app-all-achievements-card>

        <br>
    </div>

</div>
